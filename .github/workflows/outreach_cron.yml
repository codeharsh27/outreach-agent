name: Automated Daily Outreach Pipeline

on:
  schedule:
    # Run every Monday through Friday at 08:00 AM UTC
    - cron: '0 8 * * 1-5'
  workflow_dispatch: # Manual trigger from GitHub UI anytime

jobs:
  outreach:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Outreach Pipeline & Push Live Telegram Cards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          YOUR_NAME: ${{ secrets.YOUR_NAME }}
          USER_ROLE: ${{ secrets.USER_ROLE }}
          USER_PROJECT_NAME: ${{ secrets.USER_PROJECT_NAME }}
          USER_PROJECT_DESC: ${{ secrets.USER_PROJECT_DESC }}
          GITHUB_ACTIONS: "true"
        run: |
          PYTHONPATH=. python3 -m agents.orchestrate run
